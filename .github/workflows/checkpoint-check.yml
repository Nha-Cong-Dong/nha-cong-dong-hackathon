name: Kiểm tra hạn nộp report

on:
  schedule:
    # 12:10 UTC Chủ nhật = 19:10 giờ VN, ngay sau hạn 19:00
    - cron: '10 12 * * 0'
  workflow_dispatch:
    inputs:
      week:
        description: 'Checkpoint cần kiểm tra'
        required: true
        type: choice
        options: ['1', '2', '3', '4']

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          WEEK: ${{ inputs.week }}
        with:
          script: |
            const run = require('./.github/scripts/checkpoint-check.js');
            await run({ github, context, core, weekInput: process.env.WEEK });
